name: Testumgebung bauen

# Testumgebung fuer das iPad (Yann, 12.09.2026): Der Zweig `entwicklung` wird
# ohne Server gebaut, damit sich neue Staende auf dem Geraet ansehen lassen,
# bevor sie auf Azure gehen. Live bleibt Azure
# (https://isotec-dokumentation.azurewebsites.net, Zweig `main`, docs/AZURE.md).
#
# Ohne Server heisst: keine Anmeldung, keine Kundensuche, keine Ablage in
# MeisterTask, keine Sanierungsvorschau (VITE_OHNE_SERVER in src/lib/api.ts).
# Alles andere (Fotos, Videos, Prinzipskizze mit Zeichentool, Angebotsmappe,
# Praesentation, Speicher im Geraet) laeuft im Browser und ist pruefbar.
#
# Adresse: https://techniker-feedback-isotec.github.io/analysetermin-fotodoku/
#
# Zwei Workflows, weil die Pages-Umgebung `github-pages` nur dem Zweig `main`
# das Ausliefern erlaubt (Regel, die GitHub beim Einschalten anlegt; Yann will
# dafuer nichts klicken). Dieser Workflow baut auf `entwicklung` und legt
# `dist` als Artefakt ab. Sobald er fertig ist, startet auf `main` der Workflow
# "Testumgebung ausliefern" (testumgebung-ausliefern.yml), holt das Artefakt
# und schiebt es nach Pages. Ein Push auf `main` selbst liefert weiterhin nichts.

on:
  push:
    branches: [entwicklung]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhaengigkeiten
        run: npm ci

      - name: Bauen (Basis = /<Repo-Name>/, ohne Server)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_OHNE_SERVER: '1'

      - name: Keine Jekyll-Verarbeitung
        run: touch dist/.nojekyll

      - uses: actions/upload-artifact@v4
        with:
          name: testumgebung
          path: dist
          retention-days: 3
