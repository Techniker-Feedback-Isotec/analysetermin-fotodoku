name: Testumgebung auf GitHub Pages

# Testumgebung fuer das iPad (Yann, 12.09.2026): Der Zweig `entwicklung` wird
# ohne Server auf GitHub Pages gebaut, damit sich neue Staende auf dem Geraet
# ansehen lassen, bevor sie auf Azure ausgeliefert werden. Live bleibt Azure
# (https://isotec-dokumentation.azurewebsites.net, Zweig `main`, docs/AZURE.md).
#
# Ohne Server heisst: keine Anmeldung, keine Kundensuche, keine Ablage in
# MeisterTask, keine Sanierungsvorschau (VITE_OHNE_SERVER in src/lib/api.ts).
# Alles andere (Fotos, Videos, Prinzipskizze mit Zeichentool, Angebotsmappe,
# Praesentation, Speicher im Geraet) laeuft im Browser und ist pruefbar.
#
# Adresse: https://techniker-feedback-isotec.github.io/analysetermin-fotodoku/
#
# Ausgeliefert wird direkt aus dem Workflow (Quelle "GitHub Actions"), nicht
# mehr ueber einen Branch gh-pages. Pages muss dafuer EINMAL von Hand an sein:
# Settings > Pages > Build and deployment > Source: "GitHub Actions". Der
# Workflow-Token darf das nicht selbst (der erste Lauf am 12.09.2026 scheiterte
# genau daran, "enablement: true" von configure-pages reicht nicht). Solange
# Pages aus ist, bricht der Schritt "Pages einrichten" ab - das ist dann der
# einzige Grund. Danach: Actions > "Testumgebung auf GitHub Pages" > Run workflow,
# oder einfach der naechste Push auf entwicklung.

on:
  push:
    branches: [entwicklung]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhaengigkeiten
        run: npm ci

      - name: Pages einrichten
        uses: actions/configure-pages@v5

      - name: Bauen (Basis = /<Repo-Name>/, ohne Server)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_OHNE_SERVER: '1'

      - name: Keine Jekyll-Verarbeitung
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  ausliefern:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
