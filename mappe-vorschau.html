<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Angebotsmappe · Entwürfe</title>
    <style>
      :root {
        --red: #d51317;
        --brown: #564a44;
        --grey: #e0e0e0;
        --light: #f4f4f4;
      }
      body {
        margin: 0;
        padding: 24px 28px 60px;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: var(--light);
        color: var(--brown);
        line-height: 1.45;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.3rem;
      }
      h2 {
        margin: 34px 0 4px;
        font-size: 1.05rem;
      }
      p.hinweis {
        margin: 0 0 8px;
        color: #7a6f68;
        font-size: 0.9rem;
        max-width: 70ch;
      }
      .reihe {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      .karte {
        background: #fff;
        border: 1px solid var(--grey);
        border-radius: 10px;
        padding: 12px;
        width: 340px;
      }
      .karte h3 {
        margin: 0 0 8px;
        font-size: 0.95rem;
      }
      iframe {
        width: 100%;
        height: 450px;
        border: 1px solid var(--grey);
        border-radius: 6px;
        background: #fff;
      }
      .ganz iframe {
        height: 620px;
      }
      .ganz .karte {
        width: 480px;
      }
      .lade {
        padding: 40px 0;
        text-align: center;
        color: #a99f98;
      }
      code {
        background: #fff;
        border: 1px solid var(--grey);
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 0.85em;
      }
    </style>
  </head>
  <body>
    <h1>Angebotsmappe: Entwürfe</h1>
    <p class="hinweis">
      Echte PDFs, mit demselben Code erzeugt, der später im Werkzeug läuft. Sag mir je Abschnitt einen
      Buchstaben, dann baue ich genau diese Fassung ein. Änderungen an Texten, Farben und Abständen
      gehen hier schnell.
    </p>
    <div id="ziel"><p class="lade">Entwürfe werden erzeugt …</p></div>
    <script type="module" src="/src/mappe/vorschau.ts"></script>
  </body>
</html>
